<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08080f">
<meta name="description" content="Wedding photos: browse the gallery and download full-size copies.">
<meta property="og:type" content="website">
<meta property="og:title" content="Beejit Taylor Wedding">
<meta property="og:description" content="Wedding photos: browse the gallery and download full-size copies.">
<meta property="og:url" content="https://onlyfeet.asia/wedding/">
<meta property="og:image" content="https://onlyfeet.asia/wedding/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>Wedding Photos</title>
<style>
:root{--bg:#08080f;--surface:#0f0f1a;--accent:#d4af7a;--text:#f0f0f0;--dim:#888899}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,'Segoe UI',sans-serif}
header{padding:48px 20px 24px;text-align:center}
h1{font-size:clamp(1.6rem,4vw,2.6rem);font-weight:600;letter-spacing:.02em}
header p{color:var(--dim);margin-top:8px}
header a{color:var(--accent)}
.grid{columns:260px;column-gap:10px;padding:10px;max-width:1800px;margin:0 auto}
.grid button{display:block;width:100%;margin:0 0 10px;padding:0;border:0;background:var(--surface);border-radius:8px;overflow:hidden;cursor:zoom-in;break-inside:avoid}
.grid img{display:block;width:100%;height:auto;opacity:0;transition:transform .3s,opacity .3s}
.grid img.in{opacity:1}
.grid button:hover img{transform:scale(1.03)}
#lb{position:fixed;inset:0;background:rgba(4,4,10,.96);display:none;z-index:10}
#lb.open{display:flex;align-items:center;justify-content:center}
#big{max-width:100vw;max-height:calc(100vh - 56px);object-fit:contain;margin-bottom:56px}
.bar{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--dim);font-size:.9rem}
.bar a{border:1px solid var(--accent);color:var(--accent);padding:7px 14px;border-radius:999px;text-decoration:none}
.nav,.x{position:absolute;background:rgba(255,255,255,.08);border:0;color:var(--text);width:48px;height:48px;border-radius:50%;font-size:1.5rem;cursor:pointer}
.nav:hover,.x:hover{background:rgba(212,175,122,.25)}
.prev{left:14px;top:50%;margin-top:-24px}.next{right:14px;top:50%;margin-top:-24px}.x{top:14px;right:14px}
@media(max-width:600px){.nav{display:none}}
</style>
</head>
<body>
<header><h1 id="t">Wedding Photos</h1><p id="s"></p></header>
<main class="grid" id="g"></main>
<div id="lb" role="dialog" aria-modal="true">
  <button class="x" aria-label="Close">&#10005;</button>
  <button class="nav prev" aria-label="Previous">&#8249;</button>
  <img id="big" alt="">
  <button class="nav next" aria-label="Next">&#8250;</button>
  <div class="bar"><span id="c"></span><a id="dl">Download full size</a></div>
</div>
<script>
(async()=>{
const $=id=>document.getElementById(id);
let data;
try{data=await(await fetch('photos.json',{cache:'no-cache'})).json()}catch(e){data={photos:[]}}
const P=data.photos,base=data.fullBase||'';
document.title=$('t').textContent=data.title||'Wedding Photos';
$('s').innerHTML=P.length?P.length+' photos'+(data.zip?` &middot; <a href="${data.zip}">Download all</a>`:''):'Photos coming soon.';
const g=$('g'),lb=$('lb'),big=$('big');let cur=0;
const src=(k,i)=>`${k}/${P[(i+P.length)%P.length].id}.jpg`;
P.forEach((p,i)=>{
 const b=document.createElement('button'),im=new Image();
 b.setAttribute('aria-label','Open photo '+(i+1));
 im.onload=()=>im.classList.add('in');
 im.width=p.w;im.height=p.h;im.loading='lazy';im.decoding='async';im.alt='';im.src=src('thumbs',i);
 b.append(im);b.onclick=()=>show(i);g.append(b);
});
function show(i){
 cur=(i+P.length)%P.length;
 big.src=src('web',cur);
 $('c').textContent=`${cur+1} / ${P.length}`;
 const d=$('dl');d.href=base+encodeURIComponent(P[cur].f);d.download=P[cur].f;
 lb.classList.add('open');document.body.style.overflow='hidden';
 history.replaceState(null,'','#'+(cur+1));
 new Image().src=src('web',cur+1);new Image().src=src('web',cur-1);
}
function hide(){lb.classList.remove('open');document.body.style.overflow='';history.replaceState(null,'',location.pathname)}
lb.onclick=e=>{if(e.target===lb)hide()};
lb.querySelector('.x').onclick=hide;
lb.querySelector('.prev').onclick=()=>show(cur-1);
lb.querySelector('.next').onclick=()=>show(cur+1);
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;
 if(e.key==='Escape')hide();else if(e.key==='ArrowLeft')show(cur-1);else if(e.key==='ArrowRight')show(cur+1)});
let x0=null;
lb.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1))});
const m=location.hash.match(/^#(\d+)$/);if(m&&P[m[1]-1])show(m[1]-1);
})();
</script>
</body>
</html>
