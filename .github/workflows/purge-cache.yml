name: Purge Cloudflare Cache

# Runs on every push to main: waits for the GitHub Pages deployment of that
# commit to finish, then purges Cloudflare so visitors get the new version.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Pages deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 45); do
            RUN=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
              --jq '[.workflow_runs[] | select(.name=="pages build and deployment")][0] | "\(.status) \(.conclusion)"')
            echo "attempt $i: $RUN"
            case "$RUN" in
              "completed success") exit 0 ;;
              "completed "*) echo "Pages build did not succeed"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Pages"; exit 1
      - name: Purge Cloudflare cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | tee /tmp/cf_response.json
          if ! grep -q '"success": *true' /tmp/cf_response.json; then
            echo "Cache purge failed"; exit 1
          fi
          echo "Cache purged successfully."
